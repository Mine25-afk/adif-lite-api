# Entorno local: API + PostgreSQL. Copia .env.example a .env y completa los valores antes de levantarlo.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-adif_lite}
      POSTGRES_USER: ${POSTGRES_USER:-adif}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-adif_lite};Username=${POSTGRES_USER:-adif}
      # Npgsql toma la contraseña de PGPASSWORD: no queda escrita en la cadena de conexión.
      PGPASSWORD: ${POSTGRES_PASSWORD}
      Database__AplicarMigracionesAlIniciar: "true"
      Firebase__ProjectId: ${FIREBASE_PROJECT_ID:?Define FIREBASE_PROJECT_ID en .env}
      Kapso__ToolsApiKey: ${KAPSO_TOOLS_API_KEY:-}
      Kapso__ProjectApiKey: ${KAPSO_PROJECT_API_KEY:-}
      ConnectionStrings__Blob: ${AZURE_BLOB_CONNECTION:-}
    ports:
      - "8080:8080"

volumes:
  pgdata:
